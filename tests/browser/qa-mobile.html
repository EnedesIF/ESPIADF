<!doctype html><html lang="pt-BR"><meta charset="UTF-8"><title>Verificação mobile • ESPIA DF</title><style>body{background:#082e37;color:white;font:15px system-ui;margin:16px}button{padding:14px;font:inherit}#frames{display:flex;gap:20px;flex-wrap:wrap;align-items:start}iframe{border:2px solid #70bb9d;background:#062c36}pre{white-space:pre-wrap}h2{font-size:16px}</style><h1>ESPIA DF • testes em telas de celular e tablet</h1><button id="run">Testar 15 casos e todas as tarefas</button><pre id="result">Pronto para testar</pre><div id="frames"></div><script>
const sizes=[[360,740],[390,844],[844,390],[768,1024]],frames=document.getElementById('frames');for(const [w,h] of sizes){const wrap=document.createElement('section');wrap.innerHTML=`<h2>${w} × ${h}</h2><iframe title="Jogo em ${w} por ${h}" width="${w}" height="${h}" src="qa-mobile-frame.html"></iframe>`;frames.append(wrap)}let results=[];document.getElementById('run').onclick=()=>{results=[];document.getElementById('result').textContent='Testando…';for(const f of document.querySelectorAll('iframe'))f.contentWindow.postMessage('run-mobile-qa',location.origin)};window.addEventListener('message',e=>{if(e.origin!==location.origin||!e.data?.size)return;results.push(e.data);document.getElementById('result').textContent=JSON.stringify(results,null,2)+(results.length===sizes.length?'\nCONCLUÍDO':'')});
</script></html>
