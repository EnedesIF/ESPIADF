<!doctype html><html lang="pt-BR"><meta charset="UTF-8"><title>Verificação dos marcadores</title><style>body{margin:12px;background:#082e37;color:#fff;font:16px system-ui}iframe{display:block;border:1px solid #8fb9aa;margin:15px 0}pre{white-space:pre-wrap}</style><button id="run">Executar verificação de sobreposição</button><pre id="result">Pronto para testar 15 casos × 10 atividades × 2 posições em quatro tamanhos.</pre><iframe title="Jogo corrigido no computador" width="1276" height="566" src="qa-overlap-frame.html"></iframe><iframe title="Celular vertical" width="390" height="844" src="qa-overlap-frame.html"></iframe><iframe title="Celular horizontal" width="844" height="390" src="qa-overlap-frame.html"></iframe><iframe title="Celular compacto" width="360" height="740" src="qa-overlap-frame.html"></iframe><script>document.getElementById('run').onclick=()=>{document.getElementById('result').textContent='Testando…';document.querySelectorAll('iframe').forEach(f=>f.contentWindow.postMessage('run-overlap-test',location.origin))};window.addEventListener('message',e=>{if(e.origin===location.origin&&e.data?.size)document.getElementById('result').textContent+='\n'+JSON.stringify(e.data)});</script></html>
