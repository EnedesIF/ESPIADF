<!doctype html><html lang="pt-BR"><meta charset="UTF-8"><div id="tools" style="position:fixed;z-index:9000;top:0;left:0;background:white;color:black"><button id="test">Testar os 15 casos</button><select id="route"></select><button id="play">Jogar caso de teste</button><pre id="result"></pre></div><div id="game"></div><script type="module">
import '../../src/styles/main.css';import '../../src/styles/cartoon-ui.css';import '../../src/ui/demo/pilot-scene.css';
import {ParkChallengeScene} from '../../src/ui/challenge/ParkChallengeScene';import {GDF_ROUTES} from '../../src/data/gdf/routes';import {newParkState,savePark,PARK_ROLES} from '../../src/services/parkChallenge';import {stageClue} from '../../src/ui/challenge/Exploration';import {pilotDistance} from '../../src/ui/demo/PilotGround';
const team={id:'qa-navigation-65',name:'Equipe de teste',mentor:{email:'test@example.invalid'},members:PARK_ROLES.map((missionRole,i)=>({id:'m'+i,name:['Davi','Ana','Luiza','Kauã','Ravi','Sofia'][i],missionRole,avatar:{cartoonLook:i}}))};
const select=document.getElementById('route');for(const r of GDF_ROUTES)select.add(new Option(r.title,r.id));let game;
function start(id){game?.dispose();const s=newParkState(team,id);s.started=true;s.discussion='Vamos investigar e comparar as informações do caso.';savePark(s);game=new ParkChallengeScene(team,()=>{},()=>{},id);document.getElementById('game').replaceChildren(game.root);return game}
document.getElementById('play').onclick=()=>{document.getElementById('tools').hidden=true;start(select.value);};
document.getElementById('test').onclick=async()=>{const result=[];try{for(const r of GDF_ROUTES){await new Promise(resolve=>setTimeout(resolve,0));const g=start(r.id);cancelAnimationFrame(g.frame);g.render=()=>{};g.save=()=>{};g.refreshHUD=()=>{};g.refreshForumAlert=()=>{};for(const running of [false,true]){g.running=running;for(let index=0;index<10;index++){g.state.index=index;g.state.clue=false;g.state.discoveredClues=[];g.review=undefined;g.placeId='lab';g.position=[40,85];g.arrived=false;g.clueArrived=false;g.guideSeen='';g.close();g.loadLocation();g.goToClue();const clue=stageClue(r,g.activity.step);let i=0;while((g.placeId!==clue.place||pilotDistance(g.position,clue.at)>=2.5)&&i++<2500){g.update(.1);if(!g.dialog.hidden)throw Error(r.id+' '+index+' pista interrompida: '+g.dialog.innerText.slice(0,100));}if(i>=2500)throw Error(r.id+' '+index+' pista inacessível '+g.placeId+' '+g.position);g.state.clue=true;g.close();g.arrived=false;g.goToTask();i=0;while((g.placeId!==g.task.place||pilotDistance(g.position,g.task.target)>=4.5)&&i++<2500){g.update(.1);if(!g.dialog.hidden&&g.dialog.innerText.includes('orientação do percurso'))throw Error(r.id+' '+index+' orientação interrompeu tarefa');}if(i>=2500)throw Error(r.id+' '+index+' tarefa inacessível '+g.placeId+' '+g.position);g.close();}}g.dispose();result.push('PASS '+r.id+' • 10 tarefas/pistas • caminhar/correr');document.getElementById('result').textContent=result.join('\n');}document.getElementById('result').textContent=result.join('\n')+'\nTODOS PASSARAM';}catch(e){document.getElementById('result').textContent=result.join('\n')+'\nFAIL '+e.message;}};
start('employment');
</script></html>
