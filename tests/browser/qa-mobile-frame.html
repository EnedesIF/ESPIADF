<!doctype html><html lang="pt-BR"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><div id="game"></div><script type="module">
import '../../src/styles/main.css';import '../../src/styles/story-demo.css';import '../../src/styles/internal-ui.css';import '../../src/styles/cartoon-ui.css';import '../../src/ui/demo/pilot-scene.css';import '../../src/ui/challenge/relay-dashboard.css';import '../../src/styles/mobile.css';
import {renderAvatarCreator} from '../../src/ui/screens/AvatarCreator';import {renderTeamSetup} from '../../src/ui/screens/TeamSetup';import {renderOpening} from '../../src/ui/screens/Opening';import {relayDashboard} from '../../src/ui/challenge/RelayDashboard';import {h} from '../../src/ui/dom';
import {ParkChallengeScene} from '../../src/ui/challenge/ParkChallengeScene';import {GDF_ROUTES} from '../../src/data/gdf/routes';import {newParkState,savePark,PARK_ROLES} from '../../src/services/parkChallenge';
const team={id:'qa-phone-'+innerWidth,name:'Teste de celular',mentor:{email:'qa@example.invalid'},members:PARK_ROLES.map((missionRole,i)=>({id:'m'+i,name:['Ravi','Ana Clara','Luiza','Davi','Sofia','Kauã'][i],missionRole,avatar:{cartoonLook:[4,1,3,2,6,5][i]}}))};let game;
function start(id){game?.dispose();const s=newParkState(team,id);s.started=true;s.discussion=GDF_ROUTES.find(r=>r.id===id).question;savePark(s);game=new ParkChallengeScene(team,()=>{},()=>{},id);document.getElementById('game').replaceChildren(game.root);return game}
const check=(v,m)=>{if(!v)throw Error(innerWidth+'x'+innerHeight+': '+m)};
const wait=()=>new Promise(r=>setTimeout(r,40));
async function test(){let count=0;for(const route of GDF_ROUTES){const g=start(route.id);await wait();const header=g.root.querySelector('header'),vp=g.root.querySelector('.pilot-viewport'),pad=g.root.querySelector('.pilot-pad');check(vp.getBoundingClientRect().height>100,'cenário sem altura');check(vp.getBoundingClientRect().top>=header.getBoundingClientRect().bottom,'barra cobre cenário');check(document.documentElement.scrollWidth<=innerWidth+1,'página transborda');const rects=Array.from(pad.querySelectorAll('button')).map(b=>b.getBoundingClientRect());for(let a=0;a<rects.length;a++)for(let b=a+1;b<rects.length;b++){const x=rects[a],y=rects[b];check(!(Math.min(x.right,y.right)>Math.max(x.left,y.left)+1&&Math.min(x.bottom,y.bottom)>Math.max(x.top,y.top)+1),'botões de controle sobrepostos')} for(const b of pad.querySelectorAll('button')){const rect=b.getBoundingClientRect();check(rect.width>=43&&rect.height>=43,'controle pequeno: '+b.textContent)}
 for(const open of [()=>g.setup(),()=>g.openMap(),()=>g.openNotebook()]){open();await wait();const b=g.dialog.getBoundingClientRect();check(b.left>=0&&b.right<=innerWidth+1&&b.top>=0&&b.bottom<=innerHeight+1,'painel inicial/mapa/equipe fora da tela');check(g.dialog.scrollWidth<=g.dialog.clientWidth+2,'painel inicial/mapa/equipe transborda');g.close()}
 for(let i=0;i<10;i++){g.state.index=i;g.state.clue=true;g.state.discoveredClues=[g.clue.id];g.placeId=g.activity.place;g.position=[...g.activity.target];g.review=undefined;g.loadLocation();g.refreshHUD();g.interact();await wait();check(!g.dialog.hidden,'diálogo não abriu '+route.id+' etapa '+g.activity.step);let box=g.dialog.getBoundingClientRect();check(box.left>=0&&box.right<=innerWidth+1,'diálogo fora da largura');check(box.top>=0&&box.bottom<=innerHeight+1,'diálogo fora da altura');check(g.dialog.scrollWidth<=g.dialog.clientWidth+2,'conteúdo do diálogo transborda');check(g.dialog.querySelector('button'),'diálogo sem ação');g.answer();await wait();const formBox=g.dialog.getBoundingClientRect();check(formBox.left>=0&&formBox.right<=innerWidth+1,'formulário fora da tela');check(g.dialog.scrollWidth<=g.dialog.clientWidth+2,'formulário transborda');
 if((route.campaign==='mobility'||route.campaign==='health'||route.id==='court')&&g.activity.kind==='channel'){const select=g.dialog.querySelector('select');for(const value of (['court','sanitary'].includes(route.id)?['consulta','lai','ouvidoria']:['consulta','lai','ouvidoria','servico'])){select.value=value;select.dispatchEvent(new Event('change'));check(g.dialog.querySelectorAll('textarea').length===1,'encaminhamento exige textos duplicados');if(value==='consulta')check(!g.dialog.innerText.includes('Qual informação pública não encontrada vocês solicitariam?'),'consulta exige pedido');if(value==='lai')check(g.dialog.innerText.includes(route.id==='court'?'informação pública':'Transparência passiva é quando'),'conceito LAI ausente')}}
 if((route.campaign==='mobility'||route.campaign==='health'||route.id==='court')&&g.activity.kind==='source')check(!g.dialog.querySelector('[aria-label*="esperavam"]'),'campo de hipótese repetido');
 if((route.campaign==='mobility'||route.campaign==='health'||route.id==='court')&&g.activity.kind==='final')check(!g.dialog.querySelector('[aria-label="Data da participação externa realizada"]'),'data externa exigida sem envio');
 g.close();count++}
 }game?.dispose();const app={team,showOpening(){},showSetup(){},showMentor(){},showAdmin(){}};const screens=[['avatares',()=>renderAvatarCreator(app,'hub')],['cadastro',()=>renderTeamSetup(app)],['abertura',()=>renderOpening(app)],['professor',()=>h('main',{class:'screen dash'},relayDashboard('teacher'))],['GDF',()=>h('main',{class:'screen dash'},relayDashboard('admin'))]];for(const [name,render] of screens){const root=render();document.getElementById('game').replaceChildren(root);await wait();check(root.scrollWidth<=root.clientWidth+2,'tela '+name+' transborda '+root.scrollWidth+'/'+root.clientWidth);check(document.documentElement.scrollWidth<=innerWidth+1,'página '+name+' transborda')}start('employment');return {size:innerWidth+'x'+innerHeight,tasks:count,screens:screens.map(x=>x[0]),pass:true}}
const params=new URLSearchParams(location.search);start(params.get('route')||'park');if(params.has('activity')){game.state.index=Math.max(0,Math.min(9,Number(params.get('activity'))||0));game.state.clue=true;game.placeId=game.activity.place;game.position=[...game.activity.target];if(game.activity.kind==='channel')game.state.drafts.channel={channel:'consulta',draft:'A consulta respondeu à dúvida. A equipe vai compartilhar a orientação baseada na fonte oficial.'};game.loadLocation();game.refreshHUD();game.answer()};window.addEventListener('message',async e=>{if(e.origin!==location.origin||e.data!=='run-mobile-qa')return;try{parent.postMessage(await test(),location.origin)}catch(error){parent.postMessage({size:innerWidth+'x'+innerHeight,pass:false,error:error.message},location.origin)}});
</script></html>
