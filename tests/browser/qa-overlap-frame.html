<!doctype html><html lang="pt-BR"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><div id="game"></div><script type="module">
import '../../src/styles/main.css';import '../../src/styles/story-demo.css';import '../../src/styles/internal-ui.css';import '../../src/styles/cartoon-ui.css';import '../../src/ui/demo/pilot-scene.css';import '../../src/styles/mobile.css';
import {ParkChallengeScene} from '../../src/ui/challenge/ParkChallengeScene';import {GDF_ROUTES} from '../../src/data/gdf/routes';import {PARK_ROLES,newParkState,savePark,activitiesFor} from '../../src/services/parkChallenge';
const params=new URLSearchParams(location.search),team={id:'qa-overlap-'+innerWidth,name:'Teste de marcadores',mentor:{email:'test@example.invalid'},members:PARK_ROLES.map((missionRole,i)=>({id:'m'+i,name:['Ravi','Ana Clara','Luiza','Davi','Sofia','Kauã'][i],missionRole,avatar:{cartoonLook:i}}))};let game;
function start(route='transport'){game?.dispose();const s=newParkState(team,route);s.started=true;s.discussion='Teste funcional de posicionamento dos marcadores.';savePark(s);game=new ParkChallengeScene(team,()=>{},()=>{},route);document.getElementById('game').replaceChildren(game.root);return game}
const wait=()=>new Promise(r=>setTimeout(r,35));
function inspect(){const root=game.root,hero=root.querySelector('.pilot-avatar'),agent=root.querySelector('.pilot-agent'),actors=[hero,...(agent.hidden?[]:[agent])].map(n=>n.getBoundingClientRect());for(const n of root.querySelectorAll('.pilot-task-target,.relay-clue,.pilot-portal,.pilot-agent>b')){if(n.hidden||n.closest('[hidden]'))continue;const r=n.getBoundingClientRect();for(const a of actors)if(r.left<a.right-1&&r.right>a.left+1&&r.top<a.bottom-1&&r.bottom>a.top+1)throw Error('Sobreposição: '+n.className+' '+game.route.id+' atividade '+game.state.index)}}
async function test(){let count=0;for(const route of GDF_ROUTES){start(route.id);await wait();for(let i=0;i<10;i++){game.state.index=i;game.placeId=game.activity.place;game.state.clue=true;game.position=[...game.activity.target];game.loadLocation();game.render(false);inspect();game.position=[game.activity.target[0]+3,game.activity.target[1]+3];game.render(false);inspect();count++}}showExample();return {pass:true,size:innerWidth+'x'+innerHeight,activities:count,positions:count*2}}
function showExample(){start('transport');game.state.index=2;game.placeId=game.activity.place;game.position=[...game.activity.target];game.setAvatar();game.loadLocation();game.render(false)}
showExample();window.addEventListener('message',async e=>{if(e.origin!==location.origin||e.data!=='run-overlap-test')return;try{parent.postMessage(await test(),location.origin)}catch(err){parent.postMessage({pass:false,size:innerWidth+'x'+innerHeight,error:err.message},location.origin)}});
</script></html>
