<!doctype html><html lang="pt-BR"><meta charset="UTF-8"><title>Avatares completos em movimento</title><style>body{margin:20px;background:#123c43;color:white;font:16px system-ui}button{padding:12px;margin:7px}.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}article{background:#d7e6d5;color:#153e40;border:1px solid #8bb4a1;border-radius:12px;text-align:center}.actor{height:185px;width:185px;margin:auto}.team-cartoon-avatar{height:185px!important;width:185px!important}h1{font-size:22px}</style><h1>18 modelos • frente e costas • silhueta inteira</h1><button id="front">Caminhar de frente</button><button id="back">Caminhar de costas</button><button id="stop">Parar</button><p id="result">Pronto</p><div class="grid" id="avatars"></div><script type="module">
import '../../src/styles/cartoon-ui.css';import {cartoonAvatar} from '../../src/ui/demo/CartoonAvatar';
for(let i=0;i<18;i++){const card=document.createElement('article'),actor=document.createElement('div');actor.className='actor walking';actor.dataset.facing='down';actor.append(cartoonAvatar(i,'',{cartoonStyle:{hair:0,outfit:0,trousers:0,accessories:{}}}));card.append('Modelo '+(i+1),actor);document.getElementById('avatars').append(card)}
function pose(dir,walking){for(const actor of document.querySelectorAll('.actor')){actor.dataset.facing=dir;actor.classList.toggle('walking',walking)}const actors=[...document.querySelectorAll('.team-cartoon-avatar')];const pass=actors.length===18&&actors.every(a=>!a.querySelector('.rig-piece,.rig-body,.rear-leg')&&a.querySelector('.rear-complete'));document.getElementById('result').textContent=(pass?'PASS':'FAIL')+' • 18 silhuetas completas • '+dir+' • '+(walking?'em movimento':'paradas')}
document.getElementById('front').onclick=()=>pose('down',true);document.getElementById('back').onclick=()=>pose('up',true);document.getElementById('stop').onclick=()=>pose('down',false);pose('down',true);
</script></html>
